[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-preflight"
version = "0.2.0"
description = "Isolated merge rehearsals for independent branches"
requires-python = ">=3.11"

[project.scripts]
merge-preflight = "merge_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["merge_preflight*"]
